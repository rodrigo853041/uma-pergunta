<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenho uma pergunta pra você 😊</title>
  <meta name="description" content="Abra para ver a pergunta.">
  <meta property="og:title" content="Tenho uma pergunta pra você 😊">
  <meta property="og:description" content="Abra para ver a pergunta.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --shadow-main: 0 10px 30px rgba(0, 0, 0, 0.4);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --badge-bg: rgba(37, 99, 235, 0.15);
      --badge-text: #60a5fa;
      --badge-border: rgba(96, 165, 250, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --whatsapp-green: #25d366;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-main);
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .title {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-main);
    }

    .question-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: var(--radius-md);
      width: 100%;
      margin: 10px 0;
    }

    .question-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 6px;
    }

    .question-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .buttons-container {
      display: flex;
      gap: 16px;
      width: 100%;
      position: relative;
      min-height: 55px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
    }

    .success-btn {
      background: var(--primary);
      color: #ffffff;
    }

    .danger-btn {
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
    }

  </style>
</head>
<body>
  <main class="app-container">
    <section class="card">
      <div class="badge">Pergunta Especial</div>
      
      <h1 class="title">Ludmilla, não vale fugir dessa pergunta!</h1>

      <div class="question-box">
        <h2 class="question-title">Você aceita tomar açaí comigo?</h2>
        <p class="question-subtitle">Escolha uma das opções abaixo:</p>
      </div>

      <div class="buttons-container">
        <!-- AMBOS OS BOTÕES ENVIAM A MESMA MENSAGEM -->
        <a id="btn-sim" class="btn success-btn" href="https://wa.me/5534996342331?text=eu%20aceito%20tomar%20a%C3%A7a%C3%AD%20com%20vc%20%E2%9D%A4%EF%B8%8F">Sim</a>
        
        <a id="btn-nao" class="btn danger-btn" href="https://wa.me/5534996342331?text=eu%20aceito%20tomar%20a%C3%A7a%C3%AD%20com%20vc%20%E2%9D%A4%EF%B8%8F">Não</a>
      </div>


    </section>

  </main>


</body>
</html>
